[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "assembly-data"
version = "0.1.0"
description = "대한민국 국회 Open API 데이터 수집기"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "duckdb>=1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
assembly-collect = "download_all:main"
